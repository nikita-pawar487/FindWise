<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindWise | Product</title>

<meta id="metaDescription"
      name="description"
      content="Explore this product on FindWise, including its review, specifications, rating and buying information.">

<link rel="stylesheet" href="assets/css/style.css">

<style>

.product-page{
    max-width:900px;
    margin:50px auto;
    padding:30px;
}

.product-page img{
    width:100%;
    max-width:450px;
    display:block;
    margin:auto;
    border-radius:15px;
}

.product-page h1{
    margin:25px 0;
}

.buy-btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.buy-btn:hover{
    background:#1d4ed8;
}
@media (max-width: 600px) {

    .product-actions {
        width: 100% !important;
        display: block !important;
    }

    .product-info-row {
        width: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 20px !important;
        margin-bottom: 20px !important;
    }

    .product-buttons-row {
        width: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 8px !important;
        flex-wrap: nowrap !important;
    }

    .product-buttons-row .buy-btn,
    .product-buttons-row .back-to-findwise {
        display: inline-flex !important;
        width: auto !important;
        margin: 0 !important;
        padding: 12px 14px !important;
        font-size: 14px !important;
        white-space: nowrap !important;
        box-sizing: border-box !important;
    }
}

</style>

</head>

<body>
<script>
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>
<div class="product-page">

<div class="gallery">

    <div id="thumbnails" class="thumbnails">
        <!-- JavaScript will automatically create the thumbnails -->
    </div>

    <div class="main-image">
        <img id="image" src="" alt="Product Image">
    </div>

</div>

<h1 id="title"></h1>
<div class="product-actions">

    <div class="product-info-row">
        <p class="price" id="price"></p>
        <p class="rating" id="rating"></p>
    </div>

    <div class="product-buttons-row">
        <a id="buyBtn"
           class="buy-btn"
           target="_blank"
           rel="nofollow sponsored noopener">
            Buy on Amazon
        </a>

        <a href="index.html" class="back-to-findwise">
            ← Back to FindWise
        </a>
    </div>

</div>
  
<div class="description-box">
    <p id="description"></p>
</div>

<h2 class="section-title">📝 Product Review</h2>

<div class="description-box">
    <p id="review"></p>
</div>

<h2 class="section-title">✅ Why You'll Love It</h2>
<ul id="pros" class="pros"></ul>

<h2 class="section-title">⚠ Things to Know</h2>
<ul id="cons" class="cons"></ul>

<h2 class="section-title">📋 Specifications</h2>

<table id="specifications" class="spec-table"></table>



</div>
<script src="assets/js/products.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const id = Number(params.get("id"));


// ==========================================
// CURRENT REGION
// ==========================================

const currentRegion =
    localStorage.getItem("findwiseRegion") || "IN";


// ==========================================
// SELECT CATALOG
// ==========================================

let currentProducts;

if (currentRegion === "US") {

    currentProducts =
        typeof productsUSA !== "undefined"
            ? productsUSA
            : [];

} else {

    currentProducts =
        typeof productsIndia !== "undefined"
            ? productsIndia
            : products;

}


// ==========================================
// FIND PRODUCT
// ==========================================

const product =
    currentProducts.find(p => Number(p.id) === id);


// ==========================================
// PRODUCT NOT FOUND
// ==========================================

if (!product) {

    document.getElementById("title").textContent =
        "Product not found";

    document.getElementById("description").textContent =
        currentRegion === "US"
            ? "This USA product is not available in the USA catalog yet."
            : "This product could not be found.";

} else {


    // ==========================================
    // PAGE TITLE
    // ==========================================

    document.title =
        `FindWise | ${product.title}`;


    // ==========================================
    // META DESCRIPTION
    // ==========================================

    const metaDescription =
        document.getElementById("metaDescription");

    if (metaDescription) {

        metaDescription.setAttribute(
            "content",
            `${product.title} — read the FindWise review, rating, description and specifications before you buy.`
        );

    }


    // ==========================================
    // IMAGES
    // ==========================================

    const mainImage =
        document.getElementById("image");

    const thumbnails =
        document.getElementById("thumbnails");


    const images =
        Array.isArray(product.images)
            ? product.images
            : product.image
                ? [product.image]
                : [];


    if (images.length > 0) {

        mainImage.src =
            images[0];

        mainImage.alt =
            product.title;


        images.forEach((img) => {

            const thumb =
                document.createElement("img");

            thumb.src =
                img;

            thumb.className =
                "thumb";

            thumb.alt =
                product.title;


            thumb.onclick = function () {

                mainImage.src =
                    img;

            };


            thumbnails.appendChild(
                thumb
            );

        });

    }


    // ==========================================
    // PRODUCT TITLE
    // ==========================================

    document.getElementById("title")
        .textContent =
        product.title;


    // ==========================================
    // PRICE
    // ==========================================

    document.getElementById("price")
        .textContent =
        product.price || "";


    // ==========================================
    // RATING
    // ==========================================

    document.getElementById("rating")
        .textContent =
        product.rating
            ? "⭐ " + product.rating
            : "";


    // ==========================================
    // DESCRIPTION
    // ==========================================

    document.getElementById("description")
        .textContent =
        product.description || "";


    // ==========================================
    // REVIEW
    // ==========================================

    document.getElementById("review")
        .textContent =
        product.review || "";


    // ==========================================
    // PROS
    // ==========================================

    const pros =
        document.getElementById("pros");

    pros.innerHTML = "";


    (product.pros || []).forEach(item => {

        const li =
            document.createElement("li");

        li.textContent =
            item;

        pros.appendChild(li);

    });


    // ==========================================
    // CONS
    // ==========================================

    const cons =
        document.getElementById("cons");

    cons.innerHTML = "";


    (product.cons || []).forEach(item => {

        const li =
            document.createElement("li");

        li.textContent =
            item;

        cons.appendChild(li);

    });


    // ==========================================
    // SPECIFICATIONS
    // ==========================================

    const specs =
        document.getElementById("specifications");

    specs.innerHTML = "";


    Object.entries(
        product.specifications || {}
    ).forEach(([key, value]) => {

        const row =
            document.createElement("tr");

        const keyCell =
            document.createElement("td");

        const valueCell =
            document.createElement("td");


        keyCell.textContent =
            key;

        valueCell.textContent =
            value;


        row.appendChild(keyCell);

        row.appendChild(valueCell);


        specs.appendChild(row);

    });


    // ==========================================
    // AMAZON BUTTON
    // ==========================================

    const buyBtn =
        document.getElementById("buyBtn");


    if (product.amazon) {

        buyBtn.href =
            product.amazon;

        buyBtn.textContent =
            "Buy on Amazon";

    } else {

        buyBtn.href =
            "#";

        buyBtn.textContent =
            "Amazon Link Coming Soon";

        buyBtn.style.opacity =
            "0.7";

        buyBtn.style.pointerEvents =
            "none";

    }

}

</script>


</body>

</html>
