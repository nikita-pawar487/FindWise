<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FindWise Product</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>


<style>

.product-page {

    max-width: 900px;

    margin: 50px auto;

    padding: 30px;

}


.product-page img {

    width: 100%;

    max-width: 450px;

    display: block;

    margin: auto;

    border-radius: 15px;

}


.product-page h1 {

    margin: 25px 0;

}


.buy-btn {

    display: inline-block;

    margin-top: 25px;

    padding: 15px 30px;

    background: #2563eb;

    color: white;

    text-decoration: none;

    border-radius: 10px;

}


.buy-btn:hover {

    background: #1d4ed8;

}


.product-price {

    font-size: 24px;

    font-weight: bold;

    margin: 15px 0;

}


.product-rating {

    margin: 10px 0;

}


.product-region {

    margin-top: 10px;

    font-size: 14px;

    opacity: 0.8;

}


.product-thumbnails {

    display: flex;

    gap: 10px;

    justify-content: center;

    flex-wrap: wrap;

    margin-top: 15px;

}


.product-thumbnails img {

    width: 70px;

    height: 70px;

    object-fit: cover;

    cursor: pointer;

    border-radius: 8px;

}


.product-section {

    margin-top: 30px;

}


.product-section ul {

    padding-left: 25px;

}


.spec-table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

}


.spec-table td {

    padding: 10px;

    border-bottom: 1px solid #ddd;

}


.spec-table td:first-child {

    font-weight: bold;

}


.error-message {

    text-align: center;

    padding: 60px 20px;

}


</style>

</head>


<body>


<div class="product-page">


    <!-- ==========================
         PRODUCT IMAGE
         ========================== -->

    <img
        id="image"
        src=""
        alt=""
    >


    <!-- ==========================
         THUMBNAILS
         ========================== -->

    <div
        id="thumbnails"
        class="product-thumbnails"
    ></div>


    <!-- ==========================
         PRODUCT TITLE
         ========================== -->

    <h1 id="title"></h1>


    <!-- ==========================
         REGION
         ========================== -->

    <div
        id="region"
        class="product-region"
    ></div>


    <!-- ==========================
         PRICE
         ========================== -->

    <div
        id="price"
        class="product-price"
    ></div>


    <!-- ==========================
         RATING
         ========================== -->

    <div
        id="rating"
        class="product-rating"
    ></div>


    <!-- ==========================
         DESCRIPTION
         ========================== -->

    <div class="product-section">

        <h2>Description</h2>

        <p id="description"></p>

    </div>


    <!-- ==========================
         REVIEW
         ========================== -->

    <div class="product-section">

        <h2>Review</h2>

        <p id="review"></p>

    </div>


    <!-- ==========================
         PROS
         ========================== -->

    <div class="product-section">

        <h2>Pros</h2>

        <ul id="pros"></ul>

    </div>


    <!-- ==========================
         CONS
         ========================== -->

    <div class="product-section">

        <h2>Cons</h2>

        <ul id="cons"></ul>

    </div>


    <!-- ==========================
         SPECIFICATIONS
         ========================== -->

    <div class="product-section">

        <h2>Specifications</h2>

        <table class="spec-table">

            <tbody id="specifications"></tbody>

        </table>

    </div>


    <!-- ==========================
         AMAZON BUTTON
         ========================== -->

    <a
        id="buyBtn"
        class="buy-btn"
        target="_blank"
        rel="nofollow sponsored noopener"
    >
        Buy on Amazon
    </a>


    <br>
    <br>


    <!-- ==========================
         BACK
         ========================== -->

    <a href="index.html">
        ⬅ Back to Home
    </a>


</div>


<!-- ==========================
     PRODUCTS DATABASE
     ========================== -->

<script src="assets/js/products.js"></script>


<script>

// ==========================================
// GET PRODUCT ID
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const id =
    Number(
        params.get("id")
    );


// ==========================================
// GET CURRENT REGION
// ==========================================

const currentRegion =
    localStorage.getItem(
        "findwiseRegion"
    ) || "IN";


// ==========================================
// GET CURRENT CATALOG
// ==========================================

const currentProducts =
    currentRegion === "US"
        ? productsUSA
        : productsIndia;


// ==========================================
// FIND PRODUCT
// ==========================================

const product =
    currentProducts.find(
        p => p.id === id
    );


// ==========================================
// PRODUCT NOT FOUND
// ==========================================

if (!product) {

    document.querySelector(
        ".product-page"
    ).innerHTML = `

        <div class="error-message">

            <h1>
                Product Not Found
            </h1>

            <p>
                This product is not available
                in the selected region.
            </p>

            <br>

            <a href="index.html">
                ⬅ Back to Home
            </a>

        </div>

    `;

}


// ==========================================
// DISPLAY PRODUCT
// ==========================================

else {


    // ==========================
    // PAGE TITLE
    // ==========================

    document.title =
        `FindWise | ${product.title}`;


    // ==========================
    // MAIN IMAGE
    // ==========================

    const mainImage =
        document.getElementById(
            "image"
        );


    mainImage.src =
        product.images[0];


    mainImage.alt =
        product.title;


    // ==========================
    // THUMBNAILS
    // ==========================

    const thumbnails =
        document.getElementById(
            "thumbnails"
        );


    product.images.forEach(
        image => {

            const thumbnail =
                document.createElement(
                    "img"
                );


            thumbnail.src =
                image;


            thumbnail.alt =
                product.title;


            thumbnail.onclick =
                function () {

                    mainImage.src =
                        image;

                };


            thumbnails.appendChild(
                thumbnail
            );

        }
    );


    // ==========================
    // TITLE
    // ==========================

    document.getElementById(
        "title"
    ).textContent =
        product.title;


    // ==========================
    // REGION
    // ==========================

    document.getElementById(
        "region"
    ).textContent =
        currentRegion === "US"
            ? "🇺🇸 USA Amazon.com"
            : "🇮🇳 India Amazon.in";


    // ==========================
    // PRICE
    // ==========================

    document.getElementById(
        "price"
    ).textContent =
        product.price;


    // ==========================
    // RATING
    // ==========================

    document.getElementById(
        "rating"
    ).textContent =
        "⭐ " + product.rating;


    // ==========================
    // DESCRIPTION
    // ==========================

    document.getElementById(
        "description"
    ).textContent =
        product.description;


    // ==========================
    // REVIEW
    // ==========================

    document.getElementById(
        "review"
    ).textContent =
        product.review;


    // ==========================
    // PROS
    // ==========================

    const pros =
        document.getElementById(
            "pros"
        );


    if (product.pros) {

        product.pros.forEach(
            item => {

                const li =
                    document.createElement(
                        "li"
                    );


                li.textContent =
                    item;


                pros.appendChild(
                    li
                );

            }
        );

    }


    // ==========================
    // CONS
    // ==========================

    const cons =
        document.getElementById(
            "cons"
        );


    if (product.cons) {

        product.cons.forEach(
            item => {

                const li =
                    document.createElement(
                        "li"
                    );


                li.textContent =
                    item;


                cons.appendChild(
                    li
                );

            }
        );

    }


    // ==========================
    // SPECIFICATIONS
    // ==========================

    const specifications =
        document.getElementById(
            "specifications"
        );


    if (product.specifications) {

        Object.entries(
            product.specifications
        ).forEach(
            ([key, value]) => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const keyCell =
                    document.createElement(
                        "td"
                    );


                const valueCell =
                    document.createElement(
                        "td"
                    );


                keyCell.textContent =
                    key;


                valueCell.textContent =
                    value;


                row.appendChild(
                    keyCell
                );


                row.appendChild(
                    valueCell
                );


                specifications.appendChild(
                    row
                );

            }
        );

    }


    // ==========================
    // AMAZON BUTTON
    // ==========================

    const buyBtn =
        document.getElementById(
            "buyBtn"
        );


    if (product.amazon) {

        buyBtn.href =
            product.amazon;


        buyBtn.textContent =
            currentRegion === "US"
                ? "Buy on Amazon.com"
                : "Buy on Amazon.in";

    } else {

        buyBtn.href = "#";


        buyBtn.textContent =
            currentRegion === "US"
                ? "USA Amazon Link Coming Soon"
                : "Amazon Link Coming Soon";


        buyBtn.style.opacity =
            "0.7";


        buyBtn.style.pointerEvents =
            "none";

    }

}

</script>


</body>

</html>
