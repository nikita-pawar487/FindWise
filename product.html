<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindWise | Product</title>

<meta id="metaDescription"
      name="description"
      content="Explore this product on FindWise, including its review, specifications, rating and buying information.">

<link rel="stylesheet" href="assets/css/style.css">

<style>

.product-page{
    max-width:900px;
    margin:50px auto;
    padding:30px;
}

.product-page img{
    width:100%;
    max-width:450px;
    display:block;
    margin:auto;
    border-radius:15px;
}

.product-page h1{
    margin:25px 0;
}

.buy-btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.buy-btn:hover{
    background:#1d4ed8;
}
@media (max-width: 600px) {

    .product-actions {
        width: 100% !important;
        display: block !important;
    }

    .product-info-row {
        width: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 20px !important;
        margin-bottom: 20px !important;
    }

    .product-buttons-row {
        width: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 8px !important;
        flex-wrap: nowrap !important;
    }

    .product-buttons-row .buy-btn,
    .product-buttons-row .back-to-findwise {
        display: inline-flex !important;
        width: auto !important;
        margin: 0 !important;
        padding: 12px 14px !important;
        font-size: 14px !important;
        white-space: nowrap !important;
        box-sizing: border-box !important;
    }
}

</style>

</head>

<body>
<script>
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}
</script>
<div class="product-page">

<div class="gallery">

    <div id="thumbnails" class="thumbnails">
        <!-- JavaScript will automatically create the thumbnails -->
    </div>

    <div class="main-image">
        <img id="image" src="" alt="Product Image">
    </div>

</div>

<h1 id="title"></h1>
<div class="product-actions">

    <div class="product-info-row">
        <p class="price" id="price"></p>
        <p class="rating" id="rating"></p>
    </div>

    <div class="product-buttons-row">
        <a id="buyBtn"
           class="buy-btn"
           target="_blank"
           rel="nofollow sponsored noopener">
            Buy on Amazon
        </a>

        <a href="index.html" class="back-to-findwise">
            ← Back to FindWise
        </a>
    </div>

</div>
  
<div class="description-box">
    <p id="description"></p>
</div>

<h2 class="section-title">📝 Product Review</h2>

<div class="description-box">
    <p id="review"></p>
</div>

<h2 class="section-title">✅ Why You'll Love It</h2>
<ul id="pros" class="pros"></ul>

<h2 class="section-title">⚠ Things to Know</h2>
<ul id="cons" class="cons"></ul>

<h2 class="section-title">📋 Specifications</h2>

<table id="specifications" class="spec-table"></table>



</div>



<script src="assets/js/products.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

const product = products.find(p => p.id === id);

if (product) {
    document.title = `FindWise | ${product.title}`;

const metaDescription =
    document.getElementById("metaDescription");

if (metaDescription) {
    metaDescription.setAttribute(
        "content",
        `${product.title} — read the FindWise review, rating, description and specifications before you buy.`
    );
}

    const mainImage = document.getElementById("image");
    const thumbnails = document.getElementById("thumbnails");

    mainImage.src = product.images[0];
    mainImage.alt = product.title;

    product.images.forEach((img) => {

        const thumb = document.createElement("img");

        thumb.src = img;
        thumb.className = "thumb";

        thumb.onclick = () => {
            mainImage.src = img;
        };

        thumbnails.appendChild(thumb);

    });

    document.getElementById("title").textContent = product.title;
    document.getElementById("price").textContent = product.price;
    document.getElementById("rating").textContent = "⭐ " + product.rating;
    document.getElementById("description").textContent = product.description;
    document.getElementById("review").textContent = product.review;

    const pros = document.getElementById("pros");

    product.pros.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        pros.appendChild(li);
    });

    const cons = document.getElementById("cons");

    product.cons.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        cons.appendChild(li);
    });

    const specs = document.getElementById("specifications");

    Object.entries(product.specifications).forEach(([key, value]) => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${key}</td>
            <td>${value}</td>
        `;

        specs.appendChild(row);
    });

    document.getElementById("buyBtn").href = product.amazon;
}
</script>
<script src="assets/js/product.js"></script>

</body>

</html>
